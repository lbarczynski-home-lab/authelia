identity_providers:
  oidc:
    hmac_secret: '{{ secret "/run/secrets/OIDC_HMAC_SECRET" }}'
    jwks:
      - key: "{{ secret `/run/secrets/OIDC_ISSUER_PRIVATE_KEY` }}"
    cors:
      endpoints:
        - authorization
        - token
        - revocation
        - introspection
        - userinfo
      allowed_origins:
        - https://ai.intranet.xbhl.online
      allowed_origins_from_client_redirect_uris: true
