identity_providers:
  oidc:
    clients:
      - client_id: "mnDs7U359iJiBJLmHTkMDjIVeEoeAobQCa0NjDss"
        client_name: "Open WebUI"
        client_secret: '{{ secret "/run/secrets/OPENWEBUI_OAUTH_CLIENT_SECRET" }}'
        public: false
        authorization_policy: "two_factor"
        redirect_uris:
          - "https://ai.intranet.xbhl.online/oauth/oidc/callback"
        scopes:
          - "openid"
          - "profile"
          - "email"
        userinfo_signed_response_alg: "none"
      - client_id: 'ZergmgVUh8i3Ud8BfpOx2g16TLh3qsumskreLuMQ'
        client_name: 'GitLab'
        client_secret: '{{ secret "/run/secrets/GITLAB_OAUTH_CLIENT_SECRET" }}'
        public: false
        authorization_policy: 'two_factor'
        redirect_uris:
          - 'https://gitlab.intranet.xbhl.online/users/auth/openid_connect/callback'
        scopes:
          - 'openid'
          - 'profile'
          - 'email'
          - 'groups'
        userinfo_signed_response_alg: 'none'
        token_endpoint_auth_method: 'client_secret_basic'
      - client_id: 'fRI0uSNDxxBbYQXwhuZvnR22zmz2jN9ujy8Q9xYm'
        client_name: 'Proxmox VE'
        client_secret: '{{ secret "/run/secrets/PROXMOX_OAUTH_CLIENT_SECRET" }}'
        public: false
        authorization_policy: 'two_factor'
        redirect_uris:
          - 'https://pve.intranet.xbhl.online/'
        scopes:
          - 'openid'
          - 'profile'
          - 'email'
          - 'groups'
        userinfo_signed_response_alg: 'none'
        token_endpoint_auth_method: 'client_secret_basic'
