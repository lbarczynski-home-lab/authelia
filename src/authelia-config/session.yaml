session:
  name: "authelia_session"
  secret: '{{ secret "/run/secrets/SESSION_SECRET" }}'
  cookies:
    - domain: "xbhl.online"
      authelia_url: "https://auth.xbhl.online"
      same_site: "lax"
      expiration: "24h"
      inactivity: "2h"
      remember_me: "10y"
  redis:
    host: "redis"
    port: 6379
    password: '{{ env "REDIS_PASSWORD" }}'
