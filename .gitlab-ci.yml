include:
  - component: $CI_SERVER_FQDN/home-lab/automations/docker-compose-service-deployment@v2.0.5
    inputs:
      vm-hostname: nas.srv.xbhl.intranet
      vm-ssh-username: $SSH_USER
      vm-ssh-private-key: $SSH_PRIVATE_KEY
      service-name: authelia
      container-name: authelia
      container-location: /share/Container/services/authelia
      cloudflare-dns-strategy: tunnel
      cloudflare-tunnel-uuid: 6e38abb8-22c1-48b0-a19c-9da7ea15a3a0
      cloudflare-dns-entry-name: auth.xbhl.online
      cloudflare-zone-id: $CLOUDFLARE_ZONE_ID
      cloudflare-dns-api-token: $CLOUDFLARE_DNS_API_TOKEN
      delete-existing-container-files: true

setup:generate-build-artifacts:
  script:
    - apk add --no-cache bash jq
    - cp -r src/envs $BUILD_ARTIFACTS_DIR/
    # cloudflare tunnel
    - cp -r src/cloudflared-config $BUILD_ARTIFACTS_DIR/
    - ./scripts/generate-cloudflare-tunnel-credentials.sh -t "$CLOUDFLARE_TUNNEL_TOKEN" -o $BUILD_ARTIFACTS_DIR/cloudflared-config/credentials.json
    # ldap
    - sed -i "s|^LDAP_PASSWORD=.*|LDAP_PASSWORD=${LDAP_PASSWORD}|" $BUILD_ARTIFACTS_DIR/envs/ldap.env
    # smtp
    - sed -i "s|^SMTP_HOST=.*|SMTP_HOST=${SMTP_HOST}|" $BUILD_ARTIFACTS_DIR/envs/smtp.env
    - sed -i "s|^SMTP_PORT=.*|SMTP_PORT=${SMTP_PORT}|" $BUILD_ARTIFACTS_DIR/envs/smtp.env
    - sed -i "s|^SMTP_USERNAME=.*|SMTP_USERNAME=${SMTP_USERNAME}|" $BUILD_ARTIFACTS_DIR/envs/smtp.env
    - sed -i "s|^SMTP_PASSWORD=.*|SMTP_PASSWORD=${SMTP_PASSWORD}|" $BUILD_ARTIFACTS_DIR/envs/smtp.env
    - sed -i "s|^SMTP_FROM=.*|SMTP_FROM=${SMTP_FROM}|" $BUILD_ARTIFACTS_DIR/envs/smtp.env
    # secrets
    - cp -r src/secrets $BUILD_ARTIFACTS_DIR/
    - 'printf "%s\n" "${JWT_SECRET:?JWT_SECRET is not set}" > $BUILD_ARTIFACTS_DIR/secrets/shared/JWT_SECRET'
    - 'printf "%s\n" "${SESSION_SECRET:?SESSION_SECRET is not set}" > $BUILD_ARTIFACTS_DIR/secrets/shared/SESSION_SECRET'
    # OIDC secrets (required from CI variables)
    - 'cp "${OIDC_ISSUER_PRIVATE_KEY:?OIDC_ISSUER_PRIVATE_KEY is not set}" $BUILD_ARTIFACTS_DIR/secrets/shared/OIDC_ISSUER_PRIVATE_KEY'
    - 'printf "%s\n" "${OIDC_HMAC_SECRET:?OIDC_HMAC_SECRET is not set}" > $BUILD_ARTIFACTS_DIR/secrets/shared/OIDC_HMAC_SECRET'
    # services
    - 'printf "%s\n" "${OPENWEBUI_OAUTH_CLIENT_SECRET:?OPENWEBUI_OAUTH_CLIENT_SECRET is not set}" > $BUILD_ARTIFACTS_DIR/secrets/services/OPENWEBUI_OAUTH_CLIENT_SECRET'
    # storage
    - 'printf "%s\n" "${STORAGE_PASSWORD:?STORAGE_PASSWORD is not set}" > $BUILD_ARTIFACTS_DIR/secrets/shared/STORAGE_PASSWORD'
    - 'printf "%s\n" "${STORAGE_ENCRYPTION_KEY:?STORAGE_ENCRYPTION_KEY is not set}" > $BUILD_ARTIFACTS_DIR/secrets/shared/STORAGE_ENCRYPTION_KEY'
    - sed -i "s|^REDIS_PASSWORD=.*|REDIS_PASSWORD=${REDIS_PASSWORD}|" $BUILD_ARTIFACTS_DIR/envs/redis.env

test:authelia:validate-config:
  stage: test
  image:
    name: ghcr.io/authelia/authelia:4.39.20
    entrypoint: [""]
  variables:
    X_AUTHELIA_CONFIG_FILTERS: template
  script:
    - mkdir -p /run/secrets
    - find $BUILD_ARTIFACTS_DIR/secrets/ -type f -exec cp {} /run/secrets/ \;
    - set -a; for file in $BUILD_ARTIFACTS_DIR/envs/*.env; do source "$file"; done; set +a
    - authelia config validate --config src/authelia-config/
